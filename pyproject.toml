[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmrank"
version = "0.1.0"
description = "Trackmania esports data sync and ratings pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "alembic>=1.13.2",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.1.19",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.3.4",
  "PyYAML>=6.0.1",
  "SQLAlchemy>=2.0.31",
  "trueskill>=0.4.5",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
]

[project.scripts]
tmrank = "tmrank.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
